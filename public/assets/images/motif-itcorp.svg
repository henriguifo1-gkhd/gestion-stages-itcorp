<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!-- Motif de fond des cartes : IT CORP (tech, réseau, code, logo losange)
       + gestion des stages (diplôme, CV, mallette, calendrier, équipe, certificat).
       Tuile répétable : chaque pictogramme reste dans la tuile, pour un défilement sans couture. -->
  <g fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- Toque de diplômé (stagiaires / étudiants) -->
    <g stroke="#0090c8" transform="translate(22 18) scale(2.2) rotate(-8 12 12)">
      <path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v6"/>
    </g>

    <!-- Ordinateur portable avec code -->
    <g stroke="#0090c8" transform="translate(150 30) scale(2.4) rotate(6 12 12)">
      <rect x="4" y="5" width="16" height="10" rx="1.5"/><path d="M2 19h20"/><path d="M10 8l-2 2 2 2"/><path d="M14 8l2 2-2 2"/>
    </g>

    <!-- Losange du logo IT CORP -->
    <g transform="translate(300 22) scale(.75)">
      <polygon points="50,3 97,50 50,97 3,50" stroke="#0090c8" stroke-width="3"/>
      <polygon points="50,24 76,50 50,76 24,50" fill="#0090c8" stroke="none" opacity=".55"/>
    </g>

    <!-- CV / document de candidature -->
    <g stroke="#0090c8" transform="translate(30 130) scale(2.3) rotate(10 12 12)">
      <path d="M6 2h9l4 4v16H6z"/><path d="M15 2v4h4"/><path d="M9 11h7"/><path d="M9 15h7"/><path d="M9 19h4"/>
    </g>

    <!-- Engrenage (entreprise / informatique) -->
    <g stroke="#0090c8" transform="translate(145 140) scale(2.3)">
      <circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="2"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>
    </g>

    <!-- Mallette (monde professionnel) -->
    <g stroke="#0090c8" transform="translate(262 128) scale(2.3) rotate(-6 12 12)">
      <rect x="3" y="8" width="18" height="11" rx="1.5"/><path d="M9 8V5h6v3"/><path d="M3 13h18"/>
    </g>

    <!-- Réseau / nœuds connectés -->
    <g stroke="#0090c8" transform="translate(345 150) scale(2)">
      <circle cx="5" cy="6" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="12" cy="13" r="2.4"/><circle cx="6" cy="20" r="2"/><circle cx="19" cy="19" r="2"/>
      <path d="M6.7 7.2l3.6 4.1M17.4 6.3l-4 5M10.4 14.5l-3 4M13.7 14.6l3.7 3"/>
    </g>

    <!-- Calendrier (période de stage) -->
    <g stroke="#0090c8" transform="translate(20 262) scale(2.2) rotate(-5 12 12)">
      <rect x="3" y="5" width="18" height="16" rx="1.5"/><path d="M3 10h18M8 3v4M16 3v4"/>
      <path d="M7 14h2M11 14h2M15 14h2M7 17.5h2M11 17.5h2"/>
    </g>

    <!-- Équipe (encadrants et stagiaires) -->
    <g stroke="#0090c8" transform="translate(135 262) scale(2.3)">
      <circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/>
      <circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2c3 .1 5.5 2.4 5.5 5.8"/>
    </g>

    <!-- Certificat / attestation de stage -->
    <g stroke="#0090c8" transform="translate(255 255) scale(2.3) rotate(8 12 12)">
      <circle cx="12" cy="9" r="6"/><circle cx="12" cy="9" r="2.5"/><path d="M8.5 14l-1.5 8 5-3 5 3-1.5-8"/>
    </g>

    <!-- Balises de code -->
    <g stroke="#0090c8" transform="translate(350 270) scale(2.1) rotate(-10 12 12)">
      <path d="M8 6l-6 6 6 6"/><path d="M16 6l6 6-6 6"/><path d="M14 4l-4 16"/>
    </g>

    <!-- Bloc-notes validé (évaluation, livrables) -->
    <g stroke="#0090c8" transform="translate(80 350) scale(2.1) rotate(4 12 12)">
      <rect x="8" y="3" width="8" height="3" rx="1"/><path d="M8 5H5v16h14V5h-3"/><path d="M9 14l2 2 4-4"/>
    </g>

    <!-- Graphique en progression (suivi) -->
    <g stroke="#0090c8" transform="translate(205 352) scale(2.1)">
      <path d="M3 21h18"/><path d="M6 17v-4M11 17V9M16 17v-6M21 17V5"/><path d="M4 9l5-4 5 3 6-5"/>
    </g>

    <!-- Petits losanges et points décoratifs -->
    <g fill="#0090c8" stroke="none" opacity=".7">
      <polygon points="118,112 125,119 118,126 111,119"/>
      <polygon points="390,100 396,106 390,112 384,106"/>
      <polygon points="240,240 245,245 240,250 235,245"/>
      <polygon points="330,380 337,387 330,394 323,387"/>
      <circle cx="105" cy="245" r="2.5"/><circle cx="235" cy="110" r="2.5"/><circle cx="20" cy="400" r="2.5"/><circle cx="400" cy="230" r="2.5"/>
    </g>
  </g>
</svg>
